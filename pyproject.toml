[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "session-pipeline"
version = "0.1.0"
description = "Local integrity and artifact foundation for Persian session transcription"
requires-python = ">=3.11,<3.12"
dependencies = [
    "whisperx==3.8.6",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "torchcodec==0.7.0",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.scripts]
session-pipeline = "session_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/session_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
