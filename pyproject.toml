[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "session-pipeline"
version = "0.1.0"
description = "Local integrity and artifact foundation for Persian session transcription"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
session-pipeline = "session_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/session_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
